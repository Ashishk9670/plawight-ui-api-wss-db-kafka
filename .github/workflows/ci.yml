name: Playwright CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *' # nightly full regression (UTC)
  workflow_dispatch:
    inputs:
      scope:
        description: 'smoke or full'
        default: smoke
        type: choice
        options: [smoke, full]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pull requests and pushes run @smoke; the nightly schedule and a manual "full" run execute everything.
  FULL_RUN: ${{ github.event_name == 'schedule' || inputs.scope == 'full' }}

jobs:
  static:
    name: typecheck + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm ci --prefix aut
      - run: npm run typecheck
      - run: npm run lint

  test:
    name: test (${{ matrix.project }} ${{ matrix.shard || '1/1' }})
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Large projects are sharded across two jobs
          - { project: ui-chromium, shard: '1/2' }
          - { project: ui-chromium, shard: '2/2' }
          - { project: api, shard: '1/2' }
          - { project: api, shard: '2/2' }
          - { project: websocket }
          - { project: messaging }
          - { project: db }
          - { project: e2e }
          # Extra browsers and devices run on the nightly / manual-full runs only
          - { project: ui-firefox, nightly: true }
          - { project: ui-webkit, nightly: true }
          - { project: mobile-chrome, nightly: true }
          - { project: mobile-safari, nightly: true }
    env:
      CI: true
      SHARD: ${{ matrix.shard || '1/1' }}
      ARTIFACT_ID: ${{ matrix.project }}-${{ strategy.job-index }}
    steps:
      - name: Skip nightly-only projects on PRs and pushes
        id: gate
        run: |
          if [ "${{ matrix.nightly }}" = "true" ] && [ "$FULL_RUN" != "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping ${{ matrix.project }} outside full runs"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with: { node-version: 22, cache: npm }
      - run: npm ci
        if: steps.gate.outputs.run == 'true'

      - name: Cache Playwright browsers
        if: steps.gate.outputs.run == 'true'
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        if: steps.gate.outputs.run == 'true' && (startsWith(matrix.project, 'ui-') || startsWith(matrix.project, 'mobile-') || matrix.project == 'e2e')
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Start the AUT (Postgres, Kafka, app)
        if: steps.gate.outputs.run == 'true'
        run: npm run aut:up

      - name: Run tests
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ "$FULL_RUN" = "true" ]; then GREP=""; else GREP="--grep @smoke"; fi
          npx playwright test --project=${{ matrix.project }} --shard="$SHARD" $GREP

      - name: Show AUT logs on failure
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs --no-color --tail=200

      - name: Upload blob report and Allure results
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ env.ARTIFACT_ID }}
          path: |
            blob-report/
            allure-results/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Stop the AUT
        if: ${{ always() && steps.gate.outputs.run == 'true' }}
        run: npm run aut:down

  report:
    name: merged report
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # PR summary comment
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: all-results
      - name: Collect blob reports and Allure results
        run: |
          mkdir -p all-blob-reports allure-results
          find all-results -path '*blob-report/*' -type f -exec cp {} all-blob-reports/ \;
          find all-results -path '*allure-results/*' -type f -exec cp {} allure-results/ \;
          ls all-blob-reports | head

      - name: Merge into one HTML report and one JSON file
        run: |
          PLAYWRIGHT_JSON_OUTPUT_NAME=merged.json npx playwright merge-reports --reporter=html,json ./all-blob-reports
        env:
          PLAYWRIGHT_HTML_OPEN: never

      - name: Job summary (and PR comment on pull requests)
        run: node scripts/ci-summary.mjs merged.json > summary.md
      - run: cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file summary.md --edit-last --create-if-none
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Generate the Allure report
        run: npm run allure:generate
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14
          if-no-files-found: ignore

  pages:
    name: publish report to GitHub Pages
    needs: report
    # Opt-in: set the repository variable ENABLE_PAGES=true and Settings > Pages > Source = GitHub Actions.
    if: ${{ !cancelled() && vars.ENABLE_PAGES == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
